# Javascript Node CircleCI 2.0 configuration file
# Check https://circleci.com/docs/2.0/language-javascript/ for more details
version: 2
jobs:
  build:
    docker:
      - image: circleci/node:7.10
    steps:
      - checkout
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "yarn.lock" }}
          - v1-dependencies-
      - run: yarn install
      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "yarn.lock" }}
  audit:
    docker:
      - image: circleci/node:7.10
    steps:
      - restore_cache:
        keys:
        - v1-dependencies-{{ checksum "yarn.lock" }}
        - v1-dependencies-
      - run: yarn flow
      - run: yarn lint
  test-dev:
    docker:
      - image: circleci/node:7.10
    steps:
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "yarn.lock" }}
          - v1-dependencies-
      - run: yarn test:cov
      - run: yarn report-coverage
  test-prod:
    docker:
      - image: circleci/node:7.10
    steps:
      - restore_cache:
          keys:
          - v1-dependencies-{{ checksum "yarn.lock" }}
          - v1-dependencies-
      - run: yarn test:prod
workflows:
  version: 2
  microcosm:
    jobs:
      - build
      - audit:
          requires:
            - build
      - test-dev:
          requires:
            - build
      - test-prod:
          requires:
            - build
